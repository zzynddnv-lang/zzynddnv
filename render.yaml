services:
  - type: web
    name: zuxriddin-yordamchi-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python zuxriddin_yordamchi_bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SKLAD_CHAT_ID
        sync: false
      - key: KOMPANIYA_NOMI
        value: UMATIC
      - key: TAKLIF_REJIMI
        value: mavjudlik
      - key: KATTA_BUYURTMA_CHEGARASI
        value: "100000000"
      - key: OLDINDAN_TOLOV_FOIZI
        value: "50"
      - key: MODEL
        value: openai/gpt-oss-120b
      - key: FALLBACK_MODELS
        value: qwen/qwen3.8-27b
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
