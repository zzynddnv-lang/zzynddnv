services:
  - type: web
    name: zuxriddin-yordamchi-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python zuxriddin_yordamchi_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EGA_ISMI
        value: Zuxriddin
      - key: MODEL
        value: qwen/qwen3.8-27b
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
